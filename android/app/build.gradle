plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 本机机密（DeepSeek Key）放在 local.properties（已 gitignore，不进版本库）
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.aix.origin.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.aix.origin.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        // 高德 Key：在 gradle.properties 中配置 amapKey，或命令行 -PamapKey=xxxx
        manifestPlaceholders = [
                AMAP_KEY: project.findProperty("amapKey") ?: "REPLACE_WITH_YOUR_AMAP_KEY"
        ]

        // DeepSeek LLM：Key 与模型 ID 经 BuildConfig 注入（默认空 Key = 未启用）
        buildConfigField "String", "DEEPSEEK_API_KEY", "\"${project.findProperty("deepseekKey") ?: localProps.getProperty("deepseekKey") ?: ""}\""
        buildConfigField "String", "DEEPSEEK_MODEL", "\"${project.findProperty("deepseekModel") ?: "deepseek-v4-flash"}\""
        // 高德 Web 服务 Key（步行路线 REST 接口用）
        buildConfigField "String", "AMAP_WEB_KEY", "\"${localProps.getProperty("amapWebKey") ?: project.findProperty("amapWebKey") ?: ""}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // 高德 3D 地图 SDK（10.x 已内置定位；步行路线改用 Web 服务 REST 接口，不再依赖 search SDK）
    implementation 'com.amap.api:3dmap:10.0.600'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
