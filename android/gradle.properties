# AIxOrigin App gradle.properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# 高德地图 Key（app/build.gradle 的 manifestPlaceholders 读取此值注入 Manifest）
amapKey=aab5943c7688ed9bb87a3bdeb5142edd

# DeepSeek LLM（app/build.gradle 的 buildConfigField 读取注入 BuildConfig）
#   deepseekKey   ：写在 android/local.properties（gitignored，不进版本库），此处不填
#   deepseekModel ：模型 ID。默认 deepseek-v4-flash（低延迟，适合实时逃生）；
#                   若要更强推理可用 deepseek-v4-pro（更慢、可能带思考模式、更贵）。
deepseekModel=deepseek-v4-flash
