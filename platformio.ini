; ============================================================================
;  AIxOriginDemo —— PlatformIO 工程配置
;  适用: 装有 VSCode + PlatformIO 插件的环境
;  使用: 用 PlatformIO 打开本目录 -> 选择对应 env -> Build / Upload / Monitor
; ============================================================================

[platformio]
; 源码目录指向 Arduino 草图文件夹 (也可被 Arduino IDE 直接打开)
src_dir = firmware/AIxNode

; ----------------------------------------------------------------------------
; 三块板子可分别用不同 env 编译, 角色在 build_flags 里用 NODE_ROLE 切换:
;   1 = 哨兵/触发端(终端复合)  2 = 指挥/中继  3 = 随身逃生终端
; 也可以复制下面的 [env] 段, 把 env:esp32-s3-devkitc-1 改名后各设不同 NODE_ROLE,
; 这样三块板子只需分别 Upload 一次。
; ----------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

lib_deps =
    olikraus/U8g2

build_flags =
    ; 角色(1=A哨兵/触发, 2=B指挥/中继, 3=C随身终端)
    -D NODE_ROLE=1
    ; 如需覆盖 OLED 配置 / 节点 ID, 取消注释并修改:
    -D OLED_MODEL=3
    ; -D OLED_SCK=12
    ; -D OLED_MOSI=11
    ; -D OLED_MISO=13
    ; -D OLED_CS=10
    ; -D OLED_DC=6
    ; -D OLED_RES=7
    ; -D NODE_ID=\"Node_A\"

; --- 也可以单独建立 B / C 板的环境(去掉注释启用) ---
; [env:esp32-s3-devkitc-1-nodeB]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200
; lib_deps = olikraus/U8g2
; build_flags = -D NODE_ROLE=2

; [env:esp32-s3-devkitc-1-nodeC]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200
; lib_deps = olikraus/U8g2
; build_flags = -D NODE_ROLE=3
